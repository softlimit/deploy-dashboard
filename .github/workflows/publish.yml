name: Publish

on:
  repository_dispatch:
    types: [publish]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/build/send-publish.js
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          PUBLISH_DEPLOY_DATE: ${{ github.event.client_payload.deployDate }}
          PUBLISH_VIEW_URL: ${{ github.event.client_payload.viewUrl }}
          PUBLISH_BY_CLIENT: ${{ toJSON(github.event.client_payload.byClient) }}
